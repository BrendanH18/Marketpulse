[project]
name = "marketpulse"
dynamic = ["version"]
description = "A fast, keyboard-first terminal investment tracker with live market data, Omarchy themes and a macOS menu bar companion"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Brendan Hallas" }]
keywords = ["portfolio", "investment-tracker", "terminal", "tui", "canada"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "click>=8.1",
    "curl-cffi>=0.7",
    "rich>=13.7",
    "textual>=8.2.7",
]

[project.urls]
Homepage = "https://github.com/BrendanH18/Marketpulse"
Documentation = "https://github.com/BrendanH18/Marketpulse#readme"
Repository = "https://github.com/BrendanH18/Marketpulse"
Issues = "https://github.com/BrendanH18/Marketpulse/issues"

[project.scripts]
marketpulse = "marketpulse.cli:main"
mp = "marketpulse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketpulse"]

[tool.hatch.version]
path = "src/marketpulse/__init__.py"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/marketpulse/themes_data.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["marketpulse"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
# Check the bodies of functions without annotations too (most CLI/TUI glue).
check_untyped_defs = true
# Keep `# type: ignore` honest: fail when one is no longer needed.
warn_unused_ignores = true
warn_redundant_casts = true
