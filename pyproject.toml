[project]
name = "marketpulse"
version = "0.1.0"
description = "A terminal-based portfolio tracker with live market data"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.7",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "textual>=8.2.7",
]

[project.scripts]
marketpulse = "marketpulse.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketpulse"]
