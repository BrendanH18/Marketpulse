[project]
name = "marketpulse"
version = "2.0.0"
description = "A fast, keyboard-first terminal investment tracker with live market data, Omarchy themes and a macOS menu bar companion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "curl-cffi>=0.7",
    "rich>=13.7",
    "textual>=8.2.7",
]

[project.scripts]
marketpulse = "marketpulse.cli:main"
mp = "marketpulse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketpulse"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/marketpulse/themes_data.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["marketpulse"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
# Check the bodies of functions without annotations too (most CLI/TUI glue).
check_untyped_defs = true
# Keep `# type: ignore` honest: fail when one is no longer needed.
warn_unused_ignores = true
warn_redundant_casts = true
