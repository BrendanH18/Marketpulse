name: CodeQL

# Advanced CodeQL setup for the Python engine, GitHub Actions workflows and Swift app on
# GitHub-hosted runners. Keep the repository's default setup off so GitHub accepts these results.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 9 * * 1" # Mondays, 09:41 UTC, so new queries run against unchanged code
  workflow_dispatch:

permissions: {}

concurrency:
  # A new push to a pull request replaces its previous run; other runs always finish.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  analyze-swift:
    name: CodeQL (swift)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
      - name: Build the Swift package
        # Under CodeQL's build tracer, SwiftPM's /usr/bin/sandbox-exec fails to launch
        # ("Bad CPU type in executable"), so build without SwiftPM's sandbox.
        run: swift build --disable-sandbox --package-path macos/MarketPulseBar
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:swift
