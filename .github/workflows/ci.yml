name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1" # Mondays, 09:17 UTC; runs only the dependency audit
  workflow_dispatch:
    inputs:
      desktop_benchmark:
        description: Run the offline desktop benchmark on macOS
        type: boolean
        default: false
  workflow_call: # the release workflow runs these checks before publishing

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces its previous run. Every other run (main, the schedule, the
  # release workflow) gets a group of its own, so none is cancelled or left pending behind another.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-benchmark:
    name: Desktop benchmark (macOS)
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_benchmark
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install benchmark dependencies
        run: uv sync --locked --dev --python 3.11
      - name: Measure the fictional ledger
        env:
          BENCHMARK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          BENCHMARK_RUNNER: macos-26
        run: uv run --locked python scripts/benchmark_desktop.py --output desktop-benchmark.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-benchmark-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: desktop-benchmark.json
          if-no-files-found: error
          retention-days: 90

  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-26
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --dev --python ${{ matrix.python }}
      - name: Test
        run: uv run --locked pytest -q

  coverage:
    name: Coverage gate (financial core)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --dev --python 3.11
      - name: Test with coverage
        run: uv run --locked pytest -q --cov
      - name: Check core coverage floors
        run: uv run --locked python scripts/check_coverage.py

  # The quick checks share one runner instead of taking one each: each finishes in seconds, and as
  # separate jobs they queued for runners behind the longer test jobs. Every check is its own step and
  # runs even when an earlier one fails, so one run still reports them all.
  lint:
    name: Lint, audit and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      menubar: ${{ steps.filter.outputs.menubar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # on a pull request, its merge commit and its base, to diff against
      - name: Check whether the Mac app is affected
        # Pull requests build the Mac app only when they touch something it builds or checks.
        # Pushes to main, manual runs, and the release workflow (workflow_call) always build it.
        if: github.event_name == 'pull_request'
        id: filter
        run: |
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          # The Swift sources, scripts and format config, the Python scripts the job runs, the Python
          # package the app bundles (the bridge check loads nearly all of it through the CLI; only
          # the terminal UI in tui/ is unused), the fixtures the bridge check reads, the bundled
          # backend's dependencies, and this workflow.
          app_paths='^(macos/'
          app_paths+='|scripts/(build_app\.py|check_native_bridge\.|smoke_restore_app\.py|[^/]+\.swift$)'
          app_paths+='|src/marketpulse/'
          app_paths+='|tests/fixtures/'
          app_paths+='|\.swift-format$'
          app_paths+='|pyproject\.toml|uv\.lock'
          app_paths+='|\.github/workflows/ci\.yml)'
          if grep -E "$app_paths" "$RUNNER_TEMP/changed.txt" | grep -qvE '^src/marketpulse/tui/'; then
            echo "menubar=true" >> "$GITHUB_OUTPUT"
          else
            echo "menubar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Mac app paths changed; skipping the menubar job."
          fi
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: ${{ !cancelled() }}
        with:
          enable-cache: ${{ github.event_name != 'schedule' }} # the weekly run only audits uv.lock and installs nothing
      - name: Audit uv.lock against the OSV advisory database
        # The only step the weekly schedule runs, so a newly published advisory shows up without a
        # code change. `uv audit` is a preview command; the flag opts in to it explicitly.
        if: ${{ !cancelled() }}
        run: uv audit --frozen --preview-features audit-command
      - name: ShellCheck install.sh
        if: ${{ !cancelled() && github.event_name != 'schedule' }}
        run: |
          shellcheck --version
          shellcheck scripts/install.sh
      - name: Install dependencies
        id: install
        if: ${{ !cancelled() && github.event_name != 'schedule' }}
        run: uv sync --locked --dev --python 3.11
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --locked ruff check .
      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --locked ruff format --check .
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --locked mypy
      - name: Build source distribution and wheel
        # After the lint steps, which would otherwise also scan the build output and smoke venv.
        id: build
        if: ${{ !cancelled() && github.event_name != 'schedule' }}
        run: uv build --no-sources
      - name: Verify installed package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          uv venv --python 3.11 .package-smoke
          uv pip install --python .package-smoke/bin/python dist/*.whl
          .package-smoke/bin/marketpulse --help
          .package-smoke/bin/marketpulse --version
          .package-smoke/bin/mp --version
          .package-smoke/bin/python -c 'from importlib.metadata import version; from marketpulse import __version__; assert version("marketpulse") == __version__'

  menubar:
    needs: lint
    # The path check runs only on pull requests. !cancelled() keeps a failed lint step from skipping
    # this job; it still runs and reports its own result.
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.lint.outputs.menubar == 'true') }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Swift format check
        run: |
          swift format --version
          swift format lint --strict -r macos/MarketPulseBar scripts/*.swift
      - name: Install backend for native bridge checks
        run: uv sync --locked --dev --python 3.11
      - name: Build menu bar companion
        run: swift build -c release --package-path macos/MarketPulseBar
      - name: Check native app bridge
        run: uv run --locked python scripts/check_native_bridge.py
      - name: Build standalone app with bundled backend (signs, verifies, smoke-tests)
        run: uv run --locked python scripts/build_app.py --out "$RUNNER_TEMP/app"
      - name: Drive the packaged app's restore sheet on a fictional ledger
        # Cancel and a stale preview must leave the scratch ledger untouched. Driving the sheet
        # requires a GUI session and Accessibility permission for the job's shell.
        run: uv run --locked python scripts/smoke_restore_app.py --app "$RUNNER_TEMP/app/$(uname -m)/MarketPulse.app"

  # The check the main ruleset requires. A job that a failed job `needs` is skipped, and a skipped
  # required check counts as passing, so this runs always() and fails if any job failed or was
  # cancelled. Skips are allowed: `menubar` runs only when the Mac app is affected (a docs-only pull
  # request skips it), and the weekly schedule runs only `lint`, for its uv.lock audit. The manual
  # desktop benchmark is left out.
  ci-passed:
    name: CI passed
    needs: [lint, test, coverage, menubar]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: No job failed or was cancelled
        run: |
          echo "Results: $RESULTS"
          ! echo "$RESULTS" | grep -qE 'failure|cancelled'
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
