name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # the release workflow runs these checks before publishing

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --dev --python 3.11
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format check
        run: uv run --locked ruff format --check .
      - name: Type check
        run: uv run --locked mypy

  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [namespace-profile-gitrunner]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: namespace-profile-macos
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --dev --python ${{ matrix.python }}
      - name: Test
        run: uv run --locked pytest -q

  windows-backend:
    name: Standalone Windows backend (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install build dependencies
        run: uv sync --locked --dev --python 3.14
      - name: Build and smoke-test the relocated backend
        run: uv run --locked python scripts/build_windows_backend.py --out "$env:RUNNER_TEMP/Windows backend"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.403
      - name: Check Windows bridge decoding and backend error paths
        run: dotnet run --project windows/MarketPulse.BridgeCheck -- "$env:RUNNER_TEMP/Windows backend/x86_64/MarketPulse-backend/python/python.exe"
      - name: Restore locked Windows demo dependencies
        run: dotnet restore windows/MarketPulse.Demo/MarketPulse.Demo.csproj --locked-mode -p:RuntimeIdentifier=win-x64 -p:SelfContained=true
      - name: Publish the standalone Windows demo with its backend
        run: |
          dotnet publish windows/MarketPulse.Demo/MarketPulse.Demo.csproj -c Release -r win-x64 --self-contained true --no-restore -o "$env:RUNNER_TEMP/Windows demo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Recurse "$env:RUNNER_TEMP/Windows backend/x86_64/MarketPulse-backend" "$env:RUNNER_TEMP/Windows demo/MarketPulse-backend"
      - name: Check the published demo against the bundled desktop bridge
        run: |
          $demo = Start-Process -FilePath "$env:RUNNER_TEMP/Windows demo/MarketPulse.Demo.exe" -ArgumentList "--check-bridge" -Wait -PassThru -NoNewWindow
          if ($demo.ExitCode -ne 0) { throw "Windows demo bridge check failed with exit code $($demo.ExitCode)." }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketpulse-windows-x64-backend
          path: ${{ runner.temp }}/Windows backend/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketpulse-windows-x64-demo
          path: ${{ runner.temp }}/Windows demo/
          if-no-files-found: error

  coverage:
    name: Coverage gate (financial core)
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --dev --python 3.11
      - name: Test with coverage
        run: uv run --locked pytest -q --cov
      - name: Check core coverage floors
        run: uv run --locked python scripts/check_coverage.py

  package:
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Build source distribution and wheel
        run: uv build --no-sources
      - name: Verify installed package
        run: |
          uv venv --python 3.11 .package-smoke
          uv pip install --python .package-smoke/bin/python dist/*.whl
          .package-smoke/bin/marketpulse --help
          .package-smoke/bin/marketpulse --version
          .package-smoke/bin/mp --version
          .package-smoke/bin/python -c 'from importlib.metadata import version; from marketpulse import __version__; assert version("marketpulse") == __version__'

  changes:
    # Pull requests build the Mac app only when they touch something it builds or checks.
    # Pushes to main, manual runs, and the release workflow (workflow_call) always build it.
    if: github.event_name == 'pull_request'
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 5
    outputs:
      menubar: ${{ steps.filter.outputs.menubar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR's merge commit and its base, to diff against
      - name: Check whether the Mac app is affected
        id: filter
        run: |
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          # The Swift sources, the scripts the job runs, the Python package the app bundles (the
          # bridge check loads nearly all of it through the CLI; only the terminal UI in tui/ is
          # unused), the fixtures the bridge check reads, the bundled backend's dependencies, and
          # this workflow.
          app_paths='^(macos/'
          app_paths+='|scripts/(build_app\.py|check_native_bridge\.)'
          app_paths+='|src/marketpulse/'
          app_paths+='|tests/fixtures/'
          app_paths+='|pyproject\.toml|uv\.lock'
          app_paths+='|\.github/workflows/ci\.yml)'
          if grep -E "$app_paths" "$RUNNER_TEMP/changed.txt" | grep -qvE '^src/marketpulse/tui/'; then
            echo "menubar=true" >> "$GITHUB_OUTPUT"
          else
            echo "menubar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Mac app paths changed; skipping the menubar job."
          fi

  menubar:
    needs: changes
    # `changes` runs only on pull requests; !cancelled() keeps its skip from skipping this job.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.menubar == 'true') }}
    runs-on: namespace-profile-macos
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install backend for native bridge checks
        run: uv sync --locked --dev --python 3.11
      - name: Build menu bar companion
        run: swift build -c release --package-path macos/MarketPulseBar
      - name: Check native app bridge
        run: uv run --locked python scripts/check_native_bridge.py
      - name: Build standalone app with bundled backend (signs, verifies, smoke-tests)
        run: uv run --locked python scripts/build_app.py --out "$RUNNER_TEMP/app"
