name: Audit

# Lints the install script and checks the locked dependencies for known vulnerabilities, on every
# pull request and weekly, so a newly published advisory shows up without a code change.

on:
  pull_request:
  schedule:
    - cron: "17 9 * * 1" # Mondays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck install.sh
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck scripts/install.sh

  dependencies:
    name: Audit uv.lock
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false # the audit reads uv.lock and installs nothing
      - name: Check locked dependencies against the OSV advisory database
        # `uv audit` is a preview command; the flag opts in to it explicitly.
        run: uv audit --frozen --preview-features audit-command
